<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小铁的工作状态 - 实时看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 1rem; }
        .last-update { color: #666; font-size: 0.8rem; margin-top: 5px; }
        .data-source { color: #444; font-size: 0.7rem; margin-top: 3px; }
        
        /* 场景区域 */
        .scene-container {
            display: flex; gap: 30px; justify-content: center;
            margin: 40px 0; flex-wrap: wrap;
        }
        .scene {
            width: 400px; height: 300px; border-radius: 20px;
            position: relative; overflow: hidden; transition: all 0.5s ease;
        }
        .scene.office {
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
        }
        .scene.office.active {
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .scene.lounge {
            background: linear-gradient(180deg, #744210 0%, #553c0a 100%);
            border: 3px solid #a0aec0;
        }
        .scene.lounge.active {
            border-color: #f6e05e;
            box-shadow: 0 0 30px rgba(246, 224, 94, 0.3);
        }
        .scene-title {
            position: absolute; top: 15px; left: 20px;
            font-size: 0.9rem; color: rgba(255,255,255,0.6);
            text-transform: uppercase; letter-spacing: 2px;
        }
        .scene-status {
            position: absolute; top: 15px; right: 20px;
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: bold;
        }
        .scene.office .scene-status {
            background: rgba(0, 212, 255, 0.2); color: #00d4ff;
        }
        .scene.lounge .scene-status {
            background: rgba(246, 224, 94, 0.2); color: #f6e05e;
        }
        .scene.office.active .scene-status {
            background: #00d4ff; color: #1a202c;
        }
        .scene.lounge.active .scene-status {
            background: #f6e05e; color: #553c0a;
        }
        .character {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%); font-size: 80px;
            transition: all 0.5s ease;
        }
        .scene.office .character {
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
        }
        .scene.lounge .character {
            filter: drop-shadow(0 0 20px rgba(246, 224, 94, 0.3));
            transform: translateX(-50%) scale(0.9);
        }
        .desk {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); width: 200px; height: 80px;
            background: linear-gradient(180deg, #4a5568 0%, #2d3748 100%);
            border-radius: 10px;
        }
        .monitor {
            position: absolute; bottom: 110px; left: 50%;
            transform: translateX(-50%); width: 100px; height: 70px;
            background: #1a202c; border: 3px solid #4a5568; border-radius: 5px;
        }
        .monitor::after {
            content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            opacity: 0.3; animation: screenGlow 2s ease-in-out infinite;
        }
        @keyframes screenGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
        .sofa {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); width: 220px; height: 60px;
            background: linear-gradient(180deg, #8b4513 0%, #654321 100%);
            border-radius: 10px;
        }
        .sofa::before {
            content: ''; position: absolute; top: -40px; left: 10px; right: 10px; height: 50px;
            background: linear-gradient(180deg, #8b4513 0%, #654321 100%);
            border-radius: 10px 10px 0 0;
        }
        
        /* 状态面板 */
        .status-panel {
            background: rgba(255,255,255,0.05); border-radius: 20px;
            padding: 30px; margin: 30px 0;
        }
        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .current-status { display: flex; align-items: center; gap: 15px; }
        .status-indicator {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; animation: pulse 2s ease-in-out infinite;
        }
        .status-indicator.working {
            background: rgba(0, 212, 255, 0.2); border: 3px solid #00d4ff;
        }
        .status-indicator.idle {
            background: rgba(246, 224, 94, 0.2); border: 3px solid #f6e05e;
        }
        .status-indicator.learning {
            background: rgba(159, 122, 234, 0.2); border: 3px solid #9f7aea;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .status-text h2 { font-size: 1.5rem; margin-bottom: 5px; }
        .status-text p { color: #888; font-size: 0.9rem; }
        .uptime { text-align: right; }
        .uptime-value { font-size: 2rem; font-weight: bold; color: #00d4ff; }
        .uptime-label { color: #888; font-size: 0.8rem; }
        
        /* 活动日志 */
        .activity-log {
            background: rgba(0,0,0,0.2); border-radius: 15px;
            padding: 20px; max-height: 300px; overflow-y: auto;
        }
        .activity-item {
            display: flex; align-items: flex-start; gap: 15px;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { color: #888; font-size: 0.8rem; min-width: 60px; }
        .activity-icon {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .activity-icon.work { background: rgba(0, 212, 255, 0.2); }
        .activity-icon.learn { background: rgba(159, 122, 234, 0.2); }
        .activity-icon.rest { background: rgba(246, 224, 94, 0.2); }
        .activity-content { flex: 1; }
        .activity-title { font-weight: 500; margin-bottom: 3px; }
        .activity-desc { color: #888; font-size: 0.85rem; }
        
        /* 学习进度 */
        .learning-section { margin-top: 30px; }
        .section-title {
            font-size: 1.2rem; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .learning-topics {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;
        }
        .topic-card {
            background: rgba(255,255,255,0.05); border-radius: 15px;
            padding: 20px; border-left: 4px solid;
        }
        .topic-card.ota { border-color: #00d4ff; }
        .topic-card.transport { border-color: #9f7aea; }
        .topic-card.pm { border-color: #f6ad55; }
        .topic-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .topic-name { font-weight: 500; }
        .topic-progress { font-size: 0.85rem; color: #888; }
        .progress-bar {
            height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 3px; overflow: hidden;
        }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .topic-card.ota .progress-fill { background: #00d4ff; }
        .topic-card.transport .progress-fill { background: #9f7aea; }
        .topic-card.pm .progress-fill { background: #f6ad55; }
        
        /* 统计数据 */
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05); border-radius: 15px;
            padding: 20px; text-align: center;
        }
        .stat-value { font-size: 2rem; font-weight: bold; margin-bottom: 5px; }
        .stat-value.blue { color: #00d4ff; }
        .stat-value.purple { color: #9f7aea; }
        .stat-value.yellow { color: #f6e05e; }
        .stat-value.green { color: #68d391; }
        .stat-label { color: #888; font-size: 0.85rem; }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .scene { width: 100%; max-width: 350px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦾 小铁的工作状态</h1>
            <p class="subtitle">24/7 全天候服务中 | OTA 交通业务产品助理</p>
            <p class="last-update" id="lastUpdate">最后更新: 加载中...</p>
            <p class="data-source">数据存储: 本地持久化</p>
        </header>
        
        <!-- 场景展示 -->
        <div class="scene-container">
            <div class="scene office active" id="officeScene">
                <span class="scene-title">💻 工作区</span>
                <span class="scene-status" id="officeStatus">工作中</span>
                <div class="desk"></div>
                <div class="monitor"></div>
                <div class="character" id="officeChar">⚡</div>
            </div>
            
            <div class="scene lounge" id="loungeScene">
                <span class="scene-title">🛋️ 学习区</span>
                <span class="scene-status" id="loungeStatus">空闲中</span>
                <div class="sofa"></div>
                <div class="character" id="loungeChar">📚</div>
            </div>
        </div>
        
        <!-- 状态面板 -->
        <div class="status-panel">
            <div class="status-header">
                <div class="current-status">
                    <div class="status-indicator working" id="statusIndicator">⚡</div>
                    <div class="status-text">
                        <h2 id="currentStatus">工作中</h2>
                        <p id="statusDetail">实时数据处理中</p>
                    </div>
                </div>
                <div class="uptime">
                    <div class="uptime-value" id="uptime">00:00:00</div>
                    <div class="uptime-label">今日运行</div>
                </div>
            </div>
            
            <!-- 活动日志 -->
            <div class="activity-log" id="activityLog">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <!-- 学习进度 -->
        <div class="learning-section">
            <h3 class="section-title">📖 自主学习进度</h3>
            <div class="learning-topics" id="learningTopics">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <!-- 统计数据 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value blue" id="tasksToday">0</div>
                <div class="stat-label">今日任务</div>
            </div>
            <div class="stat-card">
                <div class="stat-value purple" id="learnedToday">0</div>
                <div class="stat-label">学习条目</div>
            </div>
            <div class="stat-card">
                <div class="stat-value yellow" id="msgsToday">0</div>
                <div class="stat-label">消息交互</div>
            </div>
            <div class="stat-card">
                <div class="stat-value green" id="uptimePercent">0%</div>
                <div class="stat-label">在线率</div>
            </div>
        </div>
    </div>
    
    <script>
        // 数据管理器 - 使用 localStorage 持久化
        const DataManager = {
            STORAGE_KEY: 'xiaotie_status_data',
            
            // 获取今日日期字符串
            getToday() {
                return new Date().toISOString().split('T')[0];
            },
            
            // 获取存储的数据
            getData() {
                const stored = localStorage.getItem(this.STORAGE_KEY);
                const today = this.getToday();
                
                if (stored) {
                    const data = JSON.parse(stored);
                    // 检查是否是今天的数据
                    if (data.date === today) {
                        return data;
                    }
                }
                
                // 新的一天，重置数据但保留学习进度
                return this.getDefaultData();
            },
            
            // 默认数据
            getDefaultData() {
                return {
                    date: this.getToday(),
                    startTime: Date.now(),
                    tasks: 0,
                    messages: 0,
                    learning: 0,
                    activities: [],
                    currentSession: {
                        title: '工作中',
                        description: '实时数据处理中',
                        startTime: Date.now()
                    }
                };
            },
            
            // 保存数据
            saveData(data) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
            },
            
            // 增加消息计数
            incrementMessages() {
                const data = this.getData();
                data.messages++;
                this.saveData(data);
                return data.messages;
            },
            
            // 增加任务计数
            incrementTasks() {
                const data = this.getData();
                data.tasks++;
                this.saveData(data);
                return data.tasks;
            },
            
            // 增加学习计数
            incrementLearning() {
                const data = this.getData();
                data.learning++;
                this.saveData(data);
                return data.learning;
            },
            
            // 添加活动
            addActivity(title, desc, icon = '⚡') {
                const data = this.getData();
                const now = new Date();
                
                data.activities.unshift({
                    time: now.toTimeString().slice(0, 5),
                    icon: icon,
                    title: title,
                    desc: desc
                });
                
                // 只保留最近10条
                if (data.activities.length > 10) {
                    data.activities = data.activities.slice(0, 10);
                }
                
                this.saveData(data);
            },
            
            // 更新当前会话
            updateSession(title, description) {
                const data = this.getData();
                data.currentSession = {
                    title: title,
                    description: description,
                    startTime: Date.now()
                };
                this.saveData(data);
            },
            
            // 计算运行时长
            getUptime() {
                const data = this.getData();
                return Math.floor((Date.now() - data.startTime) / 1000);
            },
            
            // 计算在线率
            getUptimePercent() {
                const uptime = this.getUptime();
                const workDaySeconds = 16 * 3600; // 16小时工作日
                return Math.min(100, Math.round((uptime / workDaySeconds) * 100));
            }
        };
        
        // 状态应用
        const StatusApp = {
            init() {
                // 初始化数据（如果是新会话）
                const data = DataManager.getData();
                
                // 记录页面访问
                DataManager.incrementMessages();
                DataManager.addActivity('页面访问', '查看工作状态', '👁️');
                
                // 启动定时更新
                this.updateUI();
                setInterval(() => this.updateUI(), 1000);
                
                // 每分钟记录一次心跳
                setInterval(() => {
                    DataManager.incrementMessages();
                    DataManager.addActivity('系统心跳', '保持在线', '💓');
                }, 60000);
            },
            
            updateUI() {
                const data = DataManager.getData();
                const uptime = DataManager.getUptime();
                
                // 更新时间
                document.getElementById('lastUpdate').textContent = 
                    `最后更新: ${new Date().toLocaleTimeString('zh-CN')}`;
                
                // 更新运行时长
                const hours = Math.floor(uptime / 3600);
                const minutes = Math.floor((uptime % 3600) / 60);
                const seconds = uptime % 60;
                document.getElementById('uptime').textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // 更新统计数据
                document.getElementById('tasksToday').textContent = data.tasks;
                document.getElementById('learnedToday').textContent = data.learning;
                document.getElementById('msgsToday').textContent = data.messages;
                document.getElementById('uptimePercent').textContent = DataManager.getUptimePercent() + '%';
                
                // 更新当前状态
                document.getElementById('currentStatus').textContent = data.currentSession.title;
                document.getElementById('statusDetail').textContent = data.currentSession.description;
                
                // 更新活动日志
                this.updateActivityLog(data.activities);
                
                // 更新学习进度（固定值）
                this.updateLearning();
            },
            
            updateActivityLog(activities) {
                const log = document.getElementById('activityLog');
                log.innerHTML = '';
                
                if (activities.length === 0) {
                    log.innerHTML = '<div class="activity-item"><span class="activity-time">--:--</span><div class="activity-icon work">⏳</div><div class="activity-content"><div class="activity-title">等待活动...</div><div class="activity-desc">暂无记录</div></div></div>';
                    return;
                }
                
                activities.forEach(activity => {
                    const item = document.createElement('div');
                    item.className = 'activity-item';
                    item.innerHTML = `
                        <span class="activity-time">${activity.time}</span>
                        <div class="activity-icon work">${activity.icon}</div>
                        <div class="activity-content">
                            <div class="activity-title">${activity.title}</div>
                            <div class="activity-desc">${activity.desc}</div>
                        </div>
                    `;
                    log.appendChild(item);
                });
            },
            
            updateLearning() {
                const container = document.getElementById('learningTopics');
                const topics = [
                    { name: 'OTA 行业知识', percent: 18, class: 'ota' },
                    { name: '交通业务产品', percent: 12, class: 'transport' },
                    { name: '产品经理技能', percent: 25, class: 'pm' }
                ];
                
                container.innerHTML = topics.map(topic => `
                    <div class="topic-card ${topic.class}">
                        <div class="topic-header">
                            <span class="topic-name">${topic.name}</span>
                            <span class="topic-progress">${topic.percent}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${topic.percent}%"></div>
                        </div>
                    </div>
                `).join('');
            }
        };
        
        // 启动
        StatusApp.init();
    </script>
</body>
</html>
